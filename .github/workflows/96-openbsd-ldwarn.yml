# Experiment, not for upstream: check that the commit before this one
# leaves no OpenBSD __warn_references() linker warnings (strcpy, sprintf,
# rand, random, ...) in NUT's programs. Builds the program directories of
# the base (HEAD~2) and of that commit (HEAD~1) on OpenBSD 8.0 with clang
# and counts the warnings in each. Same vmactions setup as
# 98-bsd-experiment.yml on exp-omnios-vm.
name: "96: OpenBSD linker warnings"

on:
  push:
    branches: [exp-obsdwarn-vm]
    paths: [.github/workflows/96-openbsd-ldwarn.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ldwarn:
    name: "openbsd 8.0, clang: linker warnings before/after"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 3

      - name: Write the check script
        run: |
          set -euo pipefail
          cat > .ldwarn.sh <<'EOF'
          set -e
          W=$(cd "$(dirname "$0")" && pwd); cd "$W"
          PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin; export PATH
          CC=clang CXX=clang++; export CC CXX
          AUTOCONF_VERSION=$(cat /etc/nut-ci-autoconf); AUTOMAKE_VERSION=$(cat /etc/nut-ci-automake)
          export AUTOCONF_VERSION AUTOMAKE_VERSION
          uname -a; clang --version | head -1; ld --version | head -1
          git config --global --add safe.directory "$W"
          base=$(git rev-parse HEAD~2); change=$(git rev-parse HEAD~1)
          for rev in $base $change; do
            git checkout -q -f "$rev"; git clean -qfdx -e .ldwarn.sh
            echo "=== $(git log -1 --format='%h %s')"
            ./autogen.sh > autogen.log 2>&1
            ./configure --with-all=auto --without-docs --disable-docs-changelog > configure.log 2>&1 \
              || { tail -20 configure.log; exit 1; }
            grep -E 'define HAVE_(DECL_)?ARC4RANDOM_BUF' include/config.h || true
            for d in common clients server drivers tools/nut-scanner; do
              (cd "$d" && make -k all) || true
            done > "build-$rev.log" 2>&1
            echo "--- linker warnings in $rev:"
            grep -E 'misused|deterministic|possibly used unsafely' "build-$rev.log" \
              | sed -E 's/^.*(warning: .*)$/\1/' | sort | uniq -c || echo "    none"
            echo "--- objects named in those warnings:"
            grep -E 'misused|deterministic|possibly used unsafely' "build-$rev.log" \
              | grep -oE '[A-Za-z0-9_./-]+\.(o|lo|a|so[.0-9]*)' | sort -u | head -40 || true
            echo "--- errors: $(grep -cE '\*\*\* Error' "build-$rev.log" || true)"
          done
          (cd tests && make nutrandomtest) > randtest.log 2>&1 && tests/nutrandomtest | tail -1
          EOF
          cat .ldwarn.sh

      - name: OpenBSD
        uses: vmactions/openbsd-vm@f1ca8bc8ecc5b6ef7218e5b914836e067e1546d3 # v1.4.9
        with:
          release: "8.0"
          cpu: 4
          mem: 12288
          usesh: true
          prepare: |
            set -e
            for p in bash git gmake libltdl libtool net-snmp neon nss libusb1-- gd libmodbus; do
              pkg_add -I "$p" || echo "pkg_add $p: exit $?"
            done
            ac=$(pkg_info -Q autoconf | grep '^autoconf-2\.7' | tail -1)
            am=$(pkg_info -Q automake | grep '^automake-1\.1[0-9]' | tail -1)
            pkg_add -I "$ac" "$am"
            echo "$ac" | sed -E 's/^autoconf-([0-9]+\.[0-9]+).*/\1/' > /etc/nut-ci-autoconf
            echo "$am" | sed -E 's/^automake-([0-9]+\.[0-9]+).*/\1/' > /etc/nut-ci-automake
            useradd -m -s /bin/ksh abuild
          run: |
            set -e
            chown -R abuild .
            su -l abuild -c "sh $PWD/.ldwarn.sh"
