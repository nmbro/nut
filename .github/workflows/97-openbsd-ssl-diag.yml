# Experiment, not for upstream: which root CA extension layout do LibreSSL
# and OpenSSL both accept for NIT's self-signed test CA? See
# .github/exp/ca-experiment.sh.
name: "97: OpenBSD NIT SSL diagnostics"

on:
  push:
    branches: [exp-omnios-vm]
    paths: [.github/workflows/97-openbsd-ssl-diag.yml, .github/exp/ca-experiment.sh]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/exp

      - name: OpenBSD
        uses: vmactions/openbsd-vm@f1ca8bc8ecc5b6ef7218e5b914836e067e1546d3 # v1.4.9
        with:
          release: "8.0"
          cpu: 2
          mem: 4096
          usesh: true
          copyback: false
          run: sh .github/exp/ca-experiment.sh
