# Experiment, not for upstream: one NUT CI farm OmniOS slow-build cell,
#   gnu99-gnu++11-clang-NN-omnios-amd64-64bit-nowarn
# from "Various GNU C99+/C++98+ standard out-of-tree builds with fatal
# warnings (auto level) and non-GCC toolkits" (BUILD_TYPE=default-all-errors),
# in an OmniOS VM on a GitHub-hosted runner, booted from the attested
# nmbro/nut-ci-omnios image chain.
#
# clang 20 and 22 on r151058, 4 CPUs and 12 GB. NODE_LABELS is set as on
# every Jenkins agent, so ci_build.sh runs default-all-errors as "-quick"
# (variants mixed into the fewest builds), like the farm; without it, it
# runs "-exhaustive" (one build per variant).
name: "99: OmniOS VM experiment"

on:
  push:
    branches: [exp-omnios-vm]
    paths: [.github/workflows/99-omnios-experiment.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/nmbro/nut-ci-omnios
  # nmbro/nut-ci-omnios at the commit that built the images: its boot.sh,
  # and the identity the attestations must name
  IMAGE_TOOLS_REF: cd9a967b952ad7258ed7d4bc7de71772e9ac162d
  VM_MEM: "12288"
  NODE_LABELS: github-actions
  LANG: C
  LC_ALL: C
  TZ: UTC
  BITS: "64"
  CSTDVARIANT: gnu
  CSTDVERSION_c: "99"
  CSTDVERSION_cxx: "11"
  CI_BUILDDIR: obj
  BUILD_TYPE: default-all-errors
  BUILD_WARNFATAL: "yes"
  BUILD_WARNOPT: auto

jobs:
  cell:
    name: "OmniOS r151058, clang ${{ matrix.clang }}, gnu99/gnu++11"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - clang: "20"
            digest: sha256:2f487f0e192eed90d059d8466447fd28b4a481cbc85afca417b1961417db30dd
          - clang: "22"
            digest: sha256:7928c5f67144af48510d2f857dbd2be0332ec7ef679b44a77a32f7bdc3b9c90d
    env:
      CLANGVER: ${{ matrix.clang }}
      DIGEST: ${{ matrix.digest }}
      CCACHE_KEY: "ccache-omnios-r151058-clang${{ matrix.clang }}-amd64"
    steps:
      - name: Runner hardware
        run: |
          lscpu | grep -E '^(Model name|CPU\(s\)|Thread|Core|Socket|L3)'
          free -g | head -2

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: "${{ env.CCACHE_KEY }}-${{ github.run_id }}-${{ matrix.variant }}-${{ matrix.rep }}"
          restore-keys: "${{ env.CCACHE_KEY }}-"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nmbro/nut-ci-omnios
          ref: ${{ env.IMAGE_TOOLS_REF }}
          path: .image-tools
          persist-credentials: false

      - name: Install QEMU and cloud-localds, open /dev/kvm
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: 1.3.6

      - name: Verify the image's provenance, then pull it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://$IMAGE@$DIGEST" \
            --repo nmbro/nut-ci-omnios \
            --signer-workflow nmbro/nut-ci-omnios/.github/workflows/build.yml \
            --source-ref refs/heads/main \
            --source-digest "$IMAGE_TOOLS_REF" \
            --deny-self-hosted-runners
          oras pull "$IMAGE@$DIGEST" -o "$RUNNER_TEMP/img"

      - name: Boot the VM
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          boot="$GITHUB_WORKSPACE/.image-tools/image/boot.sh"
          case "$VARIANT" in
            control) ;;
            tuned) boot="$GITHUB_WORKSPACE/.github/exp/boot.sh" ;;
            unsafe*) boot="$GITHUB_WORKSPACE/.github/exp/boot.sh"; export VM_DISK_CACHE=unsafe ;;
          esac
          cd "$RUNNER_TEMP/img"
          qemu-img create -q -f qcow2 -F qcow2 -b "clang-$CLANGVER.c.qcow2" job.qcow2 40G
          bash "$boot" "$RUNNER_TEMP/img/job.qcow2" "$RUNNER_TEMP/img"
          pgrep -a qemu-system | cut -c1-600

      - name: Build and test as abuild in the VM
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          K="$RUNNER_TEMP/img/vmkey"
          O=(-o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -i "$K")
          vm() { ssh "${O[@]}" -p 2222 root@127.0.0.1 "$@"; }
          W=/export/home/abuild/nut
          vm "psrinfo -pv | head -3; mkdir -p $W; zfs list -o name,sync,atime,compression $W"
          if [ "$VARIANT" = unsafe-zfs ]; then
            vm "ds=\$(zfs list -H -o name $W); zfs set sync=disabled atime=off \$ds; zfs list -o name,sync,atime $W"
          fi
          mkdir -p .ccache
          printf 'compiler_check = content\nmax_size = 2G\n' > .ccache/ccache.conf
          rsync -a --delete -e "ssh ${O[*]} -p 2222" ./ "root@127.0.0.1:$W/"
          {
            echo "set -e; cd $W"
            echo "rm -rf \$HOME/.ccache; ln -s $W/.ccache \$HOME/.ccache"
            echo "export PATH=/opt/ooce/bin:/opt/ooce/llvm-$CLANGVER/bin:\$PATH CC=clang-$CLANGVER CXX=clang++-$CLANGVER"
            for v in LANG LC_ALL TZ BITS CSTDVARIANT CSTDVERSION_c CSTDVERSION_cxx \
                CI_BUILDDIR BUILD_TYPE BUILD_WARNFATAL BUILD_WARNOPT NODE_LABELS; do
              printf 'export %s=%q\n' "$v" "${!v}"
            done
            echo 'clang-'"$CLANGVER"' --version | head -1; ccache -z >/dev/null; t0=$(date +%s)'
            echo './ci_build.sh || rc=$?'
            echo 'echo "ci_build.sh took $(( $(date +%s) - t0 )) s"; ccache -s; exit ${rc:-0}'
          } > cell.sh
          rsync -a -e "ssh ${O[*]} -p 2222" cell.sh "root@127.0.0.1:/tmp/cell.sh"
          vm "chown -R abuild $W && su - abuild -c 'bash /tmp/cell.sh'" || rc=$?
          rsync -a -e "ssh ${O[*]} -p 2222" "root@127.0.0.1:$W/.ccache/" .ccache/ || true
          exit "${rc:-0}"

      - name: Save ccache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: "${{ env.CCACHE_KEY }}-${{ github.run_id }}-${{ matrix.variant }}-${{ matrix.rep }}"
