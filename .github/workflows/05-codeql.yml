# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "GHA-05: CodeQL"

on:
  push:
    branches: [ "master", "FTY", "fightwarn" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "master", "FTY", "fightwarn" ]
  schedule:
    - cron: '32 12 * * 0'
  workflow_dispatch:
    # Allow manually running the action, e.g. if disabled after some quietness in the source

jobs:
  analyze:
    name: Analyze
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # https://docs.github.com/en/actions/using-jobs/using-a-matrix-for-your-jobs
        language: [ 'cpp' ]
          # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby' ]
          # Learn more about CodeQL language support at https://aka.ms/codeql-docs/language-support
        os: [ 'ubuntu-latest' ]
          # TOTHINK: windows-latest, macos-latest?
        build-mode: [ 'manual' ]
          # https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/codeql-code-scanning-for-compiled-languages
          # Abusing "manual" here to try building with ccache (and
          # have codeql not intercept that build but parse C/C++
          # files on its own), and "manual" to custom-build without;
          # the "autobuild" mode is handled by codeql itself but
          # would probably ignore our CC/CXX setting
          # NOTE: We do not add ccache to PATH when actually compiling NUT code
          # (we only speed up "configure" stages), so compilation always happens
          # and is parsed by current CodeQL detectors of the day as they evolve!
        compiler: [ 'CC=gcc CXX=g++', 'CC=clang CXX=clang++' ]
        NUT_SSL_VARIANTS: [ 'no', 'nss', 'openssl' ]
        NUT_USB_VARIANTS: [ 'no', 'libusb-1.0', 'libusb-0.1' ]
        include:
          # Add complete new cell(s) to the matrix, separately
          # from the combinatorics dynamically made above
          - language: 'python'
            os: 'ubuntu-latest'
            compiler: 'PYTHON=python3'
            build-mode: 'none'
            NUT_SSL_VARIANTS: 'no'
            NUT_USB_VARIANTS: 'no'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    # Using hints from https://askubuntu.com/questions/272248/processing-triggers-for-man-db
    - if: matrix.language == 'cpp' && matrix.os == 'ubuntu-latest'
      name: NUT CI Prerequisite packages (Ubuntu)
      run: |
        echo "set man-db/auto-update false" | sudo debconf-communicate
        sudo dpkg-reconfigure man-db
        sudo apt-get update
        case x"${{matrix.compiler}}" in x*clang*) sudo apt-get install -y clang ;; x*) sudo apt-get install -y gcc g++ ;; esac
        sudo apt-get install -y libltdl-dev libtool libtool-bin cppcheck ccache libgd-dev libcppunit-dev libsystemd-dev libssl-dev libnss3-dev augeas-tools libaugeas-dev augeas-lenses libusb-dev libusb-1.0-0-dev libmodbus-dev libsnmp-dev libpowerman0-dev libfreeipmi-dev libipmimonitoring-dev libavahi-common-dev libavahi-core-dev libavahi-client-dev libgpiod-dev libglib2.0-dev libneon27-dev libi2c-dev i2c-tools lm-sensors ccache
        date > .timestamp-init

    - name: Prepare ccache
      # Based on https://docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching#example-using-the-cache-action example
      id: cache-ccache
      uses: actions/cache@v6
      env:
        cache-name: cache-ccache-${{ matrix.compiler }}-${{ matrix.NUT_SSL_VARIANTS }}-${{ matrix.NUT_USB_VARIANTS }}
      with:
        path: |
            ~/.ccache
            ~/.cache/ccache
            ~/.config/ccache/ccache.conf
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/.timestamp-init') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
          ${{ runner.os }}-build-
          ${{ runner.os }}-

    - name: CCache stats before build
      run: |
        ccache -sv || ccache -s || echo "FAILED to read ccache info, oh well"
        rm -f .timestamp-init

    # Make build identification more useful (no fallbacks)
    #- name: Try to get more Git metadata
    #  run: |
    #    git remote -v || true
    #    git branch -a || true
    #    for R in `git remote` ; do git fetch $R master ; done || true
    #    git fetch --tags

    #- name: Debug gitlog2version processing
    #  run: bash -x ./tools/gitlog2version.sh || true

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the (whole) list here with "+" to use these queries and those in the config file.
        # Details on CodeQL's query packs refer to : https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        queries: +security-extended,security-and-quality
        config-file: ./.github/codeql/codeql-config.yml

    # Autobuild attempts to build any compiled languages  (C/C++, C#, Go, or Java).
    # If this step fails, then you should remove it and run the build manually (see below)
    # https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/codeql-code-scanning-for-compiled-languages
    - if: matrix.build-mode == 'autobuild'
      name: Autobuild
      uses: github/codeql-action/autobuild@v4

    # ℹ️ Command-line programs to run using the OS shell.
    # 📚 See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun

    #- if: matrix.build-mode != 'autobuild' && matrix.language == 'cpp'
    #  name: NUT CI Build (default-all-errors matrix)
    #  run: |
    #    BUILD_TYPE=default-all-errors BUILD_SSL_ONCE=true DO_DISTCHECK=no CI_SKIP_CHECK=true CANBUILD_DOCS_ALL=no ${{ matrix.compiler }} NUT_SSL_VARIANTS=${{ matrix.NUT_SSL_VARIANTS }} NUT_USB_VARIANTS=${{ matrix.NUT_USB_VARIANTS }} ./ci_build.sh

    #- if: matrix.build-mode != 'autobuild' && matrix.language == 'cpp'
    #  name: NUT CI Build (fightwarn-all)
    #  run: |
    #    BUILD_TYPE=fightwarn-all ./ci_build.sh

    # TOTHINK: Can we prepare the working area once (apt, autogen => containers?)
    # and then spread it out for builds and analyses?
    # Can ccache be used across builds?
    - if: matrix.build-mode != 'autobuild' && matrix.language == 'cpp'
      name: NUT CI Build Configuration
      run: |
        case x"${{matrix.build-mode}}" in
        xmanual)
            PATH="/usr/lib/ccache:$PATH" ; export PATH
            CCACHE_COMPRESS=true; export CCACHE_COMPRESS
            ccache --version || true
            ;;
        xnone|*)
            echo "NOTE: NOT USING CCACHE for the CI-tested code base configuration" >&2
            ;;
        esac
        ( ${{matrix.compiler}} ; echo "=== CC: $CC => `command -v $CC` =>" ; $CC --version ; echo "=== CXX: $CXX => `command -v $CXX` =>" ; $CXX --version ) || true
        ./autogen.sh && \
        ./configure --enable-warnings --enable-Werror --enable-Wcolor --with-all=auto --with-dev --without-docs --disable-docs-changelog ${{matrix.compiler}} --with-ssl=${{matrix.NUT_SSL_VARIANTS}} --with-usb=${{matrix.NUT_USB_VARIANTS}}

    # NOTE: We do not add ccache to PATH here, so compilation always happens
    # and is parsed by current CodeQL detectors of the day as they evolve:
    - if: matrix.build-mode != 'autobuild' && matrix.language == 'cpp'
      name: NUT CI Build Compilation
      run: |
        echo "NOTE: NOT USING CCACHE for the CI-tested code base compilation" >&2
        ( ${{matrix.compiler}} ; echo "=== CC: $CC => `command -v $CC` =>" ; $CC --version ; echo "=== CXX: $CXX => `command -v $CXX` =>" ; $CXX --version ) || true
        make -s -j 8 || exit

    # NOTE: Assuming GNU make here, not limiting "-j NUM" runners
    - if: matrix.build-mode != 'autobuild' && matrix.language == 'cpp'
      name: NUT CI Build to verify parallel build recipes in subdirs
      run: make -s -j check-parallel-builds || exit

    - name: CCache stats after build
      run: ccache -sv || ccache -s || echo "FAILED to read ccache info, oh well"

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"

  # The Windows-specific code (WIN32 code paths, e.g. in common/wincompat.c,
  # the named pipes in upsd/upsmon/drivers, scripts/Windows/wininit.c) is not
  # built by the Linux "analyze" job above. Cross-compile NUT for 32-bit and
  # 64-bit Windows with the Debian mingw-w64 toolchains (GCC, which the CodeQL
  # Linux build tracer supports; see scripts/Windows/README.adoc for such
  # builds, and scripts/Windows/build-mingw-nut.sh for the flags), matching
  # the C runtimes of the NUT for Windows CI builds made semi-natively in
  # MSYS2: MSVCRT for 32-bit (MINGW32, GHA-09) and UCRT for 64-bit (UCRT64,
  # AppVeyor). Debian 13 "trixie" packages the UCRT toolchain (named
  # x86_64-w64-mingw32ucrt; configure gets the usual host triplet, which
  # older config.sub copies understand), Ubuntu 24.04 does not.
  # Debian packages no MinGW builds of most NUT dependencies: the regex and
  # libusb ones are cross-built by scripts/Windows/build-mingw-prereqs.sh
  # before the CodeQL tracing starts; NUT is built without the others (e.g.
  # no SSL, SNMP or nut-scanner), whose platform-independent code the job
  # above analyzes.
  analyze-windows-cross:
    name: Analyze (Windows ${{ matrix.name }}, mingw-w64 cross-build)
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'i686-msvcrt'
            host: 'i686-w64-mingw32'
            toolchain: 'i686-w64-mingw32'
            packages: 'gcc-mingw-w64-i686 g++-mingw-w64-i686'
          - name: 'x86_64-ucrt'
            host: 'x86_64-w64-mingw32'
            toolchain: 'x86_64-w64-mingw32ucrt'
            packages: 'gcc-mingw-w64-ucrt64 g++-mingw-w64-ucrt64'

    env:
      HOST: ${{ matrix.host }}
      TOOLCHAIN: ${{ matrix.toolchain }}

    steps:
    # Before the checkout, which needs git in the container
    - name: NUT CI Prerequisite packages (Debian, mingw-w64)
      env:
        MINGW_PACKAGES: ${{ matrix.packages }}
      run: |
        apt-get update
        # shellcheck disable=SC2086
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ${MINGW_PACKAGES} git ca-certificates curl patch make \
            autoconf automake libtool pkgconf python3 perl dpkg-dev

    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    # Not traced by CodeQL (third-party code)
    - name: Cross-build the regex and libusb prerequisites
      run: |
        HOST_FLAG="--host=${HOST}" \
        BUILD_FLAG="--build=$(dpkg-architecture -qDEB_BUILD_GNU_TYPE)" \
        ARCH="${HOST}" PREFIX="/usr/${TOOLCHAIN}" SUDO=" " \
        CC="${TOOLCHAIN}-gcc" CXX="${TOOLCHAIN}-g++" AR="${TOOLCHAIN}-ar" RANLIB="${TOOLCHAIN}-ranlib" \
        RC="${TOOLCHAIN}-windres" WINDRES="${TOOLCHAIN}-windres" \
        DLDIR="${RUNNER_TEMP}/nut-win-deps" NUT_PREREQS_ONLY="libregex libusb" \
            sh ./scripts/Windows/build-mingw-prereqs.sh

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: cpp
        build-mode: manual
        queries: +security-extended,security-and-quality
        config-file: ./.github/codeql/codeql-config.yml

    # The CodeQL tracer sees the compilations of this step (no ccache here);
    # flags as in scripts/Windows/build-mingw-nut.sh; PKG_CONFIG_LIBDIR keeps
    # pkg-config to the cross-built prerequisites
    - name: NUT CI Build (cross-compile for Windows)
      run: |
        TC_PREFIX="/usr/${TOOLCHAIN}"
        WINFLAGS="-D_POSIX=1 -D_POSIX_C_SOURCE=200112L -D_POSIX_THREAD_SAFE_FUNCTIONS=200112L -I${TC_PREFIX}/include/ -D_WIN32_WINNT=0xffff"
        "${TOOLCHAIN}-gcc" --version
        ./autogen.sh
        ./configure --host="${HOST}" --build="$(dpkg-architecture -qDEB_BUILD_GNU_TYPE)" \
            --prefix=/ --with-all=auto --without-docs --disable-docs-changelog \
            --enable-warnings \
            CC="${TOOLCHAIN}-gcc" CXX="${TOOLCHAIN}-g++" \
            AR="${TOOLCHAIN}-ar" RANLIB="${TOOLCHAIN}-ranlib" \
            RC="${TOOLCHAIN}-windres" WINDRES="${TOOLCHAIN}-windres" WINDMC="${TOOLCHAIN}-windmc" \
            CFLAGS="${WINFLAGS}" CXXFLAGS="${WINFLAGS}" LDFLAGS="-L${TC_PREFIX}/lib/" \
            PKG_CONFIG_PATH="${TC_PREFIX}/lib/pkgconfig" PKG_CONFIG_LIBDIR="${TC_PREFIX}/lib/pkgconfig" \
        || { cat config.log ; exit 1 ; }
        make -s -j 8

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:cpp/os:windows-${{ matrix.name }}"
